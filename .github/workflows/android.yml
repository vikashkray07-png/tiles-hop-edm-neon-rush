name: Build Tiles Hop Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: bun install

      - name: Build web application
        run: bun run build

      - name: Create Android project
        run: bunx cap add android

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Configure Google test AdMob application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              xml = re.sub(r'(<application\\b[^>]*>)', r'\\1\\n        ' + meta, xml, count=1)
              manifest.write_text(xml)
          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          strings = values / "strings.xml"
          if strings.exists():
              data = strings.read_text()
              if "name=" + chr(34) + "admob_app_id" not in data:
                  data = data.replace("</resources>", '    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\\n</resources>')
              strings.write_text(data)
          else:
              strings.write_text('<?xml version="1.0" encoding="utf-8"?>\\n<resources><string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string></resources>\\n')
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiles-Hop-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
